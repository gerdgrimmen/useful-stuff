version: '3'

# https://betterstack.com/community/guides/scaling-docker/podman-compose/
services:
  web:
    image: docker.io/nginx:latest
    # links:
    #   - "auth:auth"
    #   - "worst:worst"
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    environment:
      - NGINX_HOST=172.28.1.7
    networks:
      compucompu:
        ipv4_address: 172.28.1.7
  auth:
    image: docker.io/nginx:latest
    # links:
    #   - "auth:auth"
    ports:
      - "8020:80"
    environment:
      - NGINX_HOST=172.28.1.6
    networks:
      compucompu:
        ipv4_address: 172.28.1.6
  worst:
    image: docker.io/nginx:latest
    # links:
    #   - "auth:auth"
    ports:
      - "8040:80"
    environment:
      - NGINX_HOST=172.28.1.5
    networks:
      compucompu:
        ipv4_address: 172.28.1.5
# networks:
#   compucompu:
#     driver: bridge
#   external: true
networks:
  compucompu:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.5.0/24
          gateway: 172.28.5.254
          aux_addresses:
            host1: 172.28.1.5
            host2: 172.28.1.6
            host3: 172.28.1.7
